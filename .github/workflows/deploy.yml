name: Build My Budget Package

on:
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Package name is fixed here. Also tag with the commit SHA
          # alongside :latest, so a previously published image can still
          # be pulled/rolled back to after a new push overwrites :latest.
          tags: |
            ghcr.io/sanduandreea22/my-budget:latest
            ghcr.io/sanduandreea22/my-budget:${{ github.sha }}