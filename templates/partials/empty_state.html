{# Usage: {% include "partials/empty_state.html" with art="receipt" title="..." text="..." url=... label="..." %} #}
<div class="{% if plain %}{% else %}glass-card {% endif %}empty-state" style="grid-column:1/-1;">
  <svg class="empty-state__art" viewBox="0 0 160 120" fill="none" aria-hidden="true">
    <ellipse cx="80" cy="108" rx="52" ry="7" fill="rgba(0,0,0,.28)"/>
    {% if art == "folder" %}
      <path d="M26 36a8 8 0 0 1 8-8h26l10 12h46a8 8 0 0 1 8 8v44a8 8 0 0 1-8 8H34a8 8 0 0 1-8-8V36Z" fill="rgba(20,184,166,.22)" stroke="#2dd4bf" stroke-width="2.5"/>
      <circle cx="80" cy="68" r="14" fill="rgba(34,211,238,.25)" stroke="#22d3ee" stroke-width="2.5"/>
      <path d="M80 61v14M73 68h14" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    {% elif art == "wallet" %}
      <rect x="26" y="34" width="100" height="62" rx="12" fill="rgba(20,184,166,.22)" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M26 50h100" stroke="#2dd4bf" stroke-width="2.5"/>
      <rect x="96" y="64" width="38" height="22" rx="8" fill="rgba(34,211,238,.3)" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="108" cy="75" r="3.5" fill="#22d3ee"/>
    {% else %}
      <path d="M44 18h72v84l-12-8-12 8-12-8-12 8-12-8-12 8V18Z" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M58 40h44M58 56h28M58 72h36" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="116" cy="84" r="17" fill="rgba(20,184,166,.9)" stroke="#2dd4bf" stroke-width="2.5"/>
      <path d="M116 76v16M110 82h12" stroke="#04201c" stroke-width="3" stroke-linecap="round"/>
    {% endif %}
  </svg>
  <div class="empty-state__title">{{ title }}</div>
  <p class="muted empty-state__text">{{ text }}</p>
  {% if url %}<a class="btn" href="{{ url }}">{{ label }}</a>{% endif %}
  {% if url2 %}<a class="btn btn--ghost btn--sm" href="{{ url2 }}" style="margin-top:4px;">{{ label2 }}</a>{% endif %}
</div>
