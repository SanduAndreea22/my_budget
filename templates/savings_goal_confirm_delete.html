{% extends "base.html" %}
{% block title %}Delete Goal · MyBudget{% endblock %}

{% block content %}
<section class="glass-card" style="max-width:560px;margin:auto;padding:22px;">
  <h1 style="margin:0 0 6px;font-size:34px;letter-spacing:-.03em;">Delete goal?</h1>
  <p class="muted" style="margin:0 0 14px;">This action cannot be undone.</p>

  <div class="glass-card" style="padding:14px;">
    <div style="font-weight:950;">{{ goal.name }}</div>
    <div class="muted" style="font-size:13px;">
      {{ goal.saved_amount }} / {{ goal.target_amount }} {{ user.currency }}
    </div>
  </div>

  <form method="POST" style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;">
    {% csrf_token %}
    <button class="btn btn--danger" type="submit">Yes, delete →</button>
    <a class="btn btn--ghost" href="{% url 'savings_goals' %}">Cancel</a>
  </form>
</section>
{% endblock %}
